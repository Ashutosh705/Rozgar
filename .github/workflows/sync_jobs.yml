name: Auto-Sync Live Vacancies Pipeline

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Recruitment Scrapers Pipeline
        run: |
          python scripts/fetch_all.py

      - name: Check Diff & Commit Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vacancies.json vacancies.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Repository is up-to-date."
          else
            echo "Fresh vacancies detected! Committing and pushing to main branch..."
            git commit -m "Auto-sync live vacancies [skip ci]"
            git push origin main
          fi
