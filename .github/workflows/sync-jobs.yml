name: Auto-Sync Vacancies & Results

on:
  schedule:
    # Run automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-job-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Exam Feed Scraper
        run: |
          python scraper.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vacancies.json
          if git diff --staged --quiet; then
            echo "No new updates found. Working directory is clean."
          else
            echo "Changes detected! Committing and pushing fresh vacancies..."
            git commit -m "chore(feed): auto-sync latest vacancies and results [skip ci]"
            git push origin main
          fi
